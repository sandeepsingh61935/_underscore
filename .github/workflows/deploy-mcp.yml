name: Deploy MCP Server

on:
  push:
    branches: [main]
    paths:
      - "packages/mcp-server/**"
      - "smithery.yaml"
      - ".github/workflows/deploy-mcp.yml"
  workflow_dispatch:

concurrency:
  group: deploy-mcp-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  deploy:
    name: Build & Deploy MCP Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install MCP server dependencies
        working-directory: packages/mcp-server
        run: npm install --no-audit --no-fund

      - name: Run MCP tests
        working-directory: packages/mcp-server
        run: npm test

      - name: Build MCP server
        working-directory: packages/mcp-server
        run: npm run build

      - name: Verify Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing required secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        working-directory: packages/mcp-server
        run: |
          npx wrangler deploy

      - name: Set worker secrets if provided
        working-directory: packages/mcp-server
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            echo "$SUPABASE_URL" | npx wrangler secret put SUPABASE_URL || true
          fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "$SUPABASE_ANON_KEY" | npx wrangler secret put SUPABASE_ANON_KEY || true
          fi

      - name: Notify & Publish to Smithery.ai
        working-directory: packages/mcp-server
        if: success()
        run: |
          if [ -n "${{ secrets.SMITHERY_API_KEY }}" ]; then
            echo "Publishing updated server card to Smithery.ai..."
            npx -y @smithery/cli@latest mcp publish "https://underscore-mcp.sandeepsingh128961.workers.dev/mcp" -n sandeepss128961/underscore || true
          fi
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}

      - name: Summary
        run: |
          echo "### Cloudflare Worker Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service: \`underscore-mcp\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Endpoint: \`https://underscore-mcp.${CLOUDFLARE_ACCOUNT_ID:+<configured-subdomain>}.workers.dev/mcp\`" >> "$GITHUB_STEP_SUMMARY"
