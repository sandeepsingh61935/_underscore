name: Quality Checks

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch base branch for PR diff
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --prune --depth=1 origin ${{ github.base_ref }}

      - name: Run TypeScript type checking
        if: github.event_name == 'push'
        run: npm run type-check

      - name: Run ESLint
        if: github.event_name == 'push'
        run: npm run lint

      - name: Design system check (no new violations)
        if: github.event_name == 'pull_request'
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            -- '*.tsx' '*.ts' \
            | grep -v '\.test\.' \
            | grep -v '\.spec\.' \
            | grep -v '\.d\.ts' \
            | tr '\n' ' ' || true)
          if [ -n "$CHANGED" ]; then
            echo "Checking design system tokens in changed files: $CHANGED"
            npx eslint --max-warnings 0 $CHANGED
          else
            echo "No TypeScript/TSX files changed — skipping design system check."
          fi

      - name: Check code formatting
        if: github.event_name == 'push'
        run: npm run format:check

      - name: Legacy design system check (advisory until Layer 10)
        # Switch to check:legacy-ds:strict (no --soft) when src/ reaches 0 violations
        # across all 11 categories. Until then, this step reports counts but does not block.
        run: npm run check:legacy-ds -- --soft src/

      - name: Run unit tests
        if: github.event_name == 'push'
        run: npm test

      - name: Run tests with coverage
        if: github.event_name == 'push'
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella

      - name: Build extension
        if: github.event_name == 'push'
        run: npm run build

      - name: Upload build artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: extension-build
          path: dist/
          retention-days: 30

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run npm audit
        run: npm audit --audit-level=moderate

      - name: Check for known vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
