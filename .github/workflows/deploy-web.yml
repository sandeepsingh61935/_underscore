# Deploy web app to Cloudflare Pages (production) + Vercel on main.
# Requires repository secrets listed in docs/01-development/web-ci-cd-deploy.md
name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        type: choice
        options:
          - both
          - cloudflare
          - vercel
        default: both

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Build web
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_WEB_APP_URL: ${{ secrets.VITE_WEB_APP_URL }}
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      VITE_MCP_CLOUD_URL: ${{ secrets.VITE_MCP_CLOUD_URL }}
      VITE_MCP_ENV: ${{ secrets.VITE_MCP_ENV }}
      VITE_AUTH_EMAIL_UI: ${{ secrets.VITE_AUTH_EMAIL_UI }}
      VITE_INSTALL_DISTRIBUTION_MODE: ${{ secrets.VITE_INSTALL_DISTRIBUTION_MODE }}
      VITE_EXTENSION_PACKAGE_VERSION: ${{ secrets.VITE_EXTENSION_PACKAGE_VERSION }}
      VITE_EXTENSION_ID: ${{ secrets.VITE_EXTENSION_ID }}
      VITE_CHROME_STORE_URL: ${{ secrets.VITE_CHROME_STORE_URL }}
      VITE_FIREFOX_STORE_URL: ${{ secrets.VITE_FIREFOX_STORE_URL }}
      SUPABASE_TIMEOUT_MS: ${{ secrets.SUPABASE_TIMEOUT_MS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify build secrets
        run: |
          missing=0
          for k in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_WEB_APP_URL; do
            eval "v=\${$k:-}"
            if [ -z "$v" ]; then
              echo "Missing required secret: $k"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "See docs/01-development/web-ci-cd-deploy.md"
            exit 1
          fi

      - name: Write .env.production for Vite
        run: |
          {
            echo "VITE_SUPABASE_URL=${VITE_SUPABASE_URL}"
            echo "VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}"
            echo "VITE_WEB_APP_URL=${VITE_WEB_APP_URL}"
            [ -n "${VITE_GOOGLE_CLIENT_ID:-}" ] && echo "VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}"
            [ -n "${VITE_MCP_CLOUD_URL:-}" ] && echo "VITE_MCP_CLOUD_URL=${VITE_MCP_CLOUD_URL}"
            [ -n "${VITE_MCP_ENV:-}" ] && echo "VITE_MCP_ENV=${VITE_MCP_ENV}"
            [ -n "${VITE_AUTH_EMAIL_UI:-}" ] && echo "VITE_AUTH_EMAIL_UI=${VITE_AUTH_EMAIL_UI}"
            [ -n "${VITE_INSTALL_DISTRIBUTION_MODE:-}" ] && echo "VITE_INSTALL_DISTRIBUTION_MODE=${VITE_INSTALL_DISTRIBUTION_MODE}"
            [ -n "${VITE_EXTENSION_PACKAGE_VERSION:-}" ] && echo "VITE_EXTENSION_PACKAGE_VERSION=${VITE_EXTENSION_PACKAGE_VERSION}"
            [ -n "${VITE_EXTENSION_ID:-}" ] && echo "VITE_EXTENSION_ID=${VITE_EXTENSION_ID}"
            [ -n "${VITE_CHROME_STORE_URL:-}" ] && echo "VITE_CHROME_STORE_URL=${VITE_CHROME_STORE_URL}"
            [ -n "${VITE_FIREFOX_STORE_URL:-}" ] && echo "VITE_FIREFOX_STORE_URL=${VITE_FIREFOX_STORE_URL}"
            [ -n "${SUPABASE_TIMEOUT_MS:-}" ] && echo "SUPABASE_TIMEOUT_MS=${SUPABASE_TIMEOUT_MS}"
          } > .env.production

      - name: Package extension zips for /install
        run: npm run zip:all

      - name: Build web app (production)
        run: node --env-file=.env.production ./node_modules/vite/bin/vite.js build --config vite.config.web.ts --mode production

      - name: Upload dist-web
        uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: dist-web/
          retention-days: 7

  deploy-cloudflare:
    name: Deploy Cloudflare Pages
    needs: build
    if: >
      github.event_name != 'workflow_dispatch' ||
      inputs.target == 'both' ||
      inputs.target == 'cloudflare'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout (for wrangler project metadata)
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install wrangler
        run: npm ci --no-audit --no-fund

      - name: Verify Cloudflare secrets
        run: |
          for k in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            eval "v=\${$k:-}"
            if [ -z "$v" ]; then
              echo "Missing required secret: $k"
              exit 1
            fi
          done

      - name: Download dist-web
        uses: actions/download-artifact@v4
        with:
          name: dist-web
          path: dist-web

      - name: Deploy
        run: |
          npx wrangler pages deploy dist-web \
            --project-name=underscore-web \
            --branch=main \
            --commit-dirty=true

      - name: Summary
        run: |
          echo "### Cloudflare Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project: \`underscore-web\` (branch main)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-vercel:
    name: Deploy Vercel
    needs: build
    if: >
      github.event_name != 'workflow_dispatch' ||
      inputs.target == 'both' ||
      inputs.target == 'vercel'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Vercel secrets
        run: |
          for k in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            eval "v=\${$k:-}"
            if [ -z "$v" ]; then
              echo "Missing required secret: $k"
              echo "Create a permanent token at https://vercel.com/account/tokens (not the local CLI session token)."
              exit 1
            fi
          done
          # Local CLI session tokens (vca_) do not work with --token in CI.
          case "$VERCEL_TOKEN" in
            vca_*)
              echo "VERCEL_TOKEN looks like a CLI session token (vca_*)."
              echo "Create an account token at https://vercel.com/account/tokens and update the secret."
              exit 1
              ;;
          esac

      - name: Download dist-web
        uses: actions/download-artifact@v4
        with:
          name: dist-web
          path: dist-web

      - name: Deploy
        run: bash scripts/deploy-vercel-web.sh
        env:
          SKIP_BUILD: '1'
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Summary
        run: |
          echo "### Vercel" >> "$GITHUB_STEP_SUMMARY"
          echo "- https://underscore-web.vercel.app" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
