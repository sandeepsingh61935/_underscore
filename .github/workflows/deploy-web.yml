# Deploy web app to Cloudflare Pages (production) + Vercel on main.
# Requires repository secrets listed in docs/01-development/web-ci-cd-deploy.md
name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        type: choice
        options:
          - both
          - cloudflare
          - vercel
        default: both

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Optional: set environment: production and move secrets there for approval gates.
    # Default uses repository Actions secrets (see docs/01-development/web-ci-cd-deploy.md).

    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'both' }}
      # Build-time public config (Vite embeds VITE_* into the SPA).
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_WEB_APP_URL: ${{ secrets.VITE_WEB_APP_URL }}
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      VITE_MCP_CLOUD_URL: ${{ secrets.VITE_MCP_CLOUD_URL }}
      VITE_MCP_ENV: ${{ secrets.VITE_MCP_ENV }}
      VITE_AUTH_EMAIL_UI: ${{ secrets.VITE_AUTH_EMAIL_UI }}
      VITE_INSTALL_DISTRIBUTION_MODE: ${{ secrets.VITE_INSTALL_DISTRIBUTION_MODE }}
      VITE_EXTENSION_PACKAGE_VERSION: ${{ secrets.VITE_EXTENSION_PACKAGE_VERSION }}
      VITE_EXTENSION_ID: ${{ secrets.VITE_EXTENSION_ID }}
      VITE_CHROME_STORE_URL: ${{ secrets.VITE_CHROME_STORE_URL }}
      VITE_FIREFOX_STORE_URL: ${{ secrets.VITE_FIREFOX_STORE_URL }}
      SUPABASE_TIMEOUT_MS: ${{ secrets.SUPABASE_TIMEOUT_MS }}
      # Cloudflare Pages (wrangler)
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Vercel CLI
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify required secrets
        run: |
          missing=0
          require() {
            # shellcheck disable=SC2086
            eval "val=\${$1:-}"
            if [ -z "$val" ]; then
              echo "Missing required secret/env: $1"
              missing=1
            fi
          }
          require VITE_SUPABASE_URL
          require VITE_SUPABASE_ANON_KEY
          require VITE_WEB_APP_URL
          if [ "$TARGET" = "both" ] || [ "$TARGET" = "cloudflare" ]; then
            require CLOUDFLARE_API_TOKEN
            require CLOUDFLARE_ACCOUNT_ID
          fi
          if [ "$TARGET" = "both" ] || [ "$TARGET" = "vercel" ]; then
            require VERCEL_TOKEN
            require VERCEL_ORG_ID
            require VERCEL_PROJECT_ID
          fi
          if [ "$missing" -ne 0 ]; then
            echo "See docs/01-development/web-ci-cd-deploy.md"
            exit 1
          fi
          echo "Secrets present for target=$TARGET"

      - name: Write .env.production for Vite
        run: |
          # Values come from job env (GitHub secrets). Do not echo file contents.
          {
            echo "VITE_SUPABASE_URL=${VITE_SUPABASE_URL}"
            echo "VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}"
            echo "VITE_WEB_APP_URL=${VITE_WEB_APP_URL}"
            [ -n "${VITE_GOOGLE_CLIENT_ID:-}" ] && echo "VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}"
            [ -n "${VITE_MCP_CLOUD_URL:-}" ] && echo "VITE_MCP_CLOUD_URL=${VITE_MCP_CLOUD_URL}"
            [ -n "${VITE_MCP_ENV:-}" ] && echo "VITE_MCP_ENV=${VITE_MCP_ENV}"
            [ -n "${VITE_AUTH_EMAIL_UI:-}" ] && echo "VITE_AUTH_EMAIL_UI=${VITE_AUTH_EMAIL_UI}"
            [ -n "${VITE_INSTALL_DISTRIBUTION_MODE:-}" ] && echo "VITE_INSTALL_DISTRIBUTION_MODE=${VITE_INSTALL_DISTRIBUTION_MODE}"
            [ -n "${VITE_EXTENSION_PACKAGE_VERSION:-}" ] && echo "VITE_EXTENSION_PACKAGE_VERSION=${VITE_EXTENSION_PACKAGE_VERSION}"
            [ -n "${VITE_EXTENSION_ID:-}" ] && echo "VITE_EXTENSION_ID=${VITE_EXTENSION_ID}"
            [ -n "${VITE_CHROME_STORE_URL:-}" ] && echo "VITE_CHROME_STORE_URL=${VITE_CHROME_STORE_URL}"
            [ -n "${VITE_FIREFOX_STORE_URL:-}" ] && echo "VITE_FIREFOX_STORE_URL=${VITE_FIREFOX_STORE_URL}"
            [ -n "${SUPABASE_TIMEOUT_MS:-}" ] && echo "SUPABASE_TIMEOUT_MS=${SUPABASE_TIMEOUT_MS}"
          } > .env.production

      - name: Package extension zips for /install
        run: npm run zip:all

      - name: Build web app (production)
        run: node --env-file=.env.production ./node_modules/vite/bin/vite.js build --config vite.config.web.ts --mode production

      - name: Deploy Cloudflare Pages
        if: env.TARGET == 'both' || env.TARGET == 'cloudflare'
        run: |
          npx wrangler pages deploy dist-web \
            --project-name=underscore-web \
            --branch=main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Vercel (production)
        if: env.TARGET == 'both' || env.TARGET == 'vercel'
        run: bash scripts/deploy-vercel-web.sh
        env:
          ENV_FILE: .env.production
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # Skip rebuild — dist-web already built above
          SKIP_BUILD: '1'

      - name: Summary
        run: |
          echo "### Deploy Web" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: \`${TARGET}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TARGET" = "both" ] || [ "$TARGET" = "cloudflare" ]; then
            echo "- Cloudflare Pages: project \`underscore-web\` (branch main)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$TARGET" = "both" ] || [ "$TARGET" = "vercel" ]; then
            echo "- Vercel: https://underscore-web.vercel.app" >> "$GITHUB_STEP_SUMMARY"
          fi
