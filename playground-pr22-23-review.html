<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PR #22 & #23 Review — Spinner + SocialButton</title>
<style>
  /* ── MD3 Tokens ── */
  :root {
    --primary: #4a6fa2;
    --on-primary: #ffffff;
    --surface: #f9f9ff;
    --surface-container-lowest: #ffffff;
    --surface-container-low: #f3f3fc;
    --surface-container: #ededf6;
    --on-surface: #191c20;
    --on-surface-variant: #44474e;
    --outline: #74777f;
    --outline-variant: #c3c6cf;
    --elevation-1: 0px 1px 2px rgba(0,0,0,.30), 0px 1px 3px 1px rgba(0,0,0,.15);
    --elevation-3: 0px 4px 8px 3px rgba(0,0,0,.15), 0px 1px 3px rgba(0,0,0,.30);
    --radius-md: 12px;
    --duration-short: 200ms;
    --ease-standard: cubic-bezier(0.2, 0, 0, 1);
    --opacity-disabled: 0.38;
  }
  .dark-mode {
    --primary: #a8c8ff;
    --on-primary: #003061;
    --surface: #111418;
    --surface-container-lowest: #0c0e13;
    --surface-container-low: #191c20;
    --surface-container: #1d2024;
    --on-surface: #e2e2ea;
    --on-surface-variant: #c3c6cf;
    --outline: #8d9199;
    --outline-variant: #43474e;
    --elevation-1: 0px 1px 2px rgba(0,0,0,.5), 0px 1px 3px 1px rgba(0,0,0,.3);
    --elevation-3: 0px 4px 8px 3px rgba(0,0,0,.3), 0px 1px 3px rgba(0,0,0,.5);
  }

  /* ── Shell ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #0d0d0f;
    color: #e2e2ea;
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
  }
  header {
    padding: 14px 24px;
    border-bottom: 1px solid #2a2a30;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #0d0d0f;
  }
  header h1 { font-size: 13px; font-weight: 600; color: #e2e2ea; letter-spacing: .01em; }
  header .prs { font-size: 12px; color: #8d9199; }

  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    height: calc(100vh - 49px);
    overflow: hidden;
  }

  /* ── Controls Panel ── */
  .controls {
    background: #111115;
    border-right: 1px solid #2a2a30;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #555;
    margin-bottom: 10px;
  }
  .control-group { display: flex; flex-direction: column; gap: 10px; }
  .control { display: flex; flex-direction: column; gap: 5px; }
  .control label { font-size: 12px; color: #8d9199; }

  /* Toggle */
  .toggle-row { display: flex; align-items: center; justify-content: space-between; }
  .toggle-row label { font-size: 12px; color: #8d9199; }
  .toggle {
    position: relative; width: 36px; height: 20px;
    background: #2a2a30; border-radius: 10px; cursor: pointer;
    transition: background .2s;
  }
  .toggle.on { background: #4a6fa2; }
  .toggle::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff; transition: transform .2s;
  }
  .toggle.on::after { transform: translateX(16px); }

  /* Chips */
  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    padding: 4px 12px; border-radius: 20px; font-size: 11px; cursor: pointer;
    border: 1px solid #2a2a30; background: transparent; color: #8d9199;
    transition: all .15s;
  }
  .chip.active { background: #1a2a42; border-color: #4a6fa2; color: #a8c8ff; }

  /* Range */
  input[type=range] {
    width: 100%; accent-color: #4a6fa2; cursor: pointer;
  }

  /* ── Main Panel ── */
  .main {
    display: grid;
    grid-template-rows: 1fr 180px;
    overflow: hidden;
  }

  /* Preview */
  .preview-area {
    overflow: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    gap: 40px;
  }
  .preview-area.light-bg { background: var(--surface); }
  .preview-area.dark-bg  { background: #111418; }

  /* Component cards */
  .component-block {
    display: flex;
    flex-direction: column;
    gap: 24px;
    align-items: center;
  }
  .component-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  .light-mode .component-title { color: #44474e; }
  .dark-mode  .component-title { color: #8d9199; }

  /* ── Spinner component ── */
  .spinner {
    border-radius: 50%;
    border-style: solid;
    border-color: var(--outline-variant);
    border-top-color: var(--primary);
    animation: spin 0.8s linear infinite;
  }
  .spinner.sm { width: 16px; height: 16px; border-width: 2px; }
  .spinner.md { width: 24px; height: 24px; border-width: 2px; }
  .spinner.lg { width: 32px; height: 32px; border-width: 2px; }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .spinner-row { display: flex; align-items: center; gap: 20px; }
  .spinner-item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .size-label { font-size: 10px; color: var(--on-surface-variant); font-family: monospace; }

  /* ── SocialButton component ── */
  .social-btn {
    display: flex; align-items: center; justify-content: center;
    width: 48px; height: 48px;
    border-radius: var(--radius-md);
    background: var(--surface-container-lowest);
    border: 1px solid var(--outline-variant);
    box-shadow: var(--elevation-1);
    cursor: pointer;
    transition: box-shadow var(--duration-short) var(--ease-standard),
                transform var(--duration-short) var(--ease-standard);
    outline: none;
  }
  .social-btn:hover {
    box-shadow: var(--elevation-3);
    transform: translateY(-2px);
  }
  .social-btn:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }
  .social-btn.disabled {
    opacity: var(--opacity-disabled);
    pointer-events: none;
  }
  .social-btn svg { width: 20px; height: 20px; }
  .social-row { display: flex; gap: 12px; align-items: center; }

  /* ── Acceptance Checklist ── */
  .checklist {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 4px;
  }
  .check-item {
    display: flex; align-items: center; gap: 8px; font-size: 11px;
  }
  .check-icon {
    width: 16px; height: 16px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 9px; font-weight: 700;
  }
  .check-icon.pass { background: #1a3a2a; color: #4ade80; }
  .check-icon.fail { background: #3a1a1a; color: #f87171; }
  .check-icon.info { background: #1a2a42; color: #60a5fa; }
  .check-text { color: #8d9199; }
  .check-text.pass { color: #86efac; }
  .check-text.fail { color: #fca5a5; }

  /* ── Prompt Output ── */
  .prompt-area {
    border-top: 1px solid #2a2a30;
    background: #111115;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow: hidden;
  }
  .prompt-label {
    font-size: 10px; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase; color: #555;
  }
  .prompt-text {
    font-size: 12px; line-height: 1.6;
    color: #c3c6cf;
    font-family: monospace;
    flex: 1;
    overflow: auto;
  }
  .prompt-actions { display: flex; gap: 10px; align-items: center; }
  .copy-btn {
    padding: 6px 14px; font-size: 11px; font-weight: 600;
    background: #1a2a42; color: #a8c8ff;
    border: 1px solid #2a4a72; border-radius: 6px;
    cursor: pointer; transition: background .15s;
  }
  .copy-btn:hover { background: #243a5a; }
  .copy-btn.copied { background: #1a3a2a; color: #4ade80; border-color: #2a5a3a; }

  /* Divider */
  .divider { height: 1px; background: #2a2a30; }
</style>
</head>
<body>

<header>
  <h1>PR Review — Spinner & SocialButton MD3 Migration</h1>
  <span class="prs">PR #22 (closes #5) &nbsp;·&nbsp; PR #23 (closes #6)</span>
</header>

<div class="layout">

  <!-- Controls -->
  <div class="controls">

    <div>
      <div class="section-label">Context</div>
      <div class="control-group">
        <div class="toggle-row">
          <label>Dark mode</label>
          <div class="toggle" id="darkToggle" onclick="toggleDark()"></div>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="section-label">PR #22 — Spinner</div>
      <div class="control-group">
        <div class="toggle-row">
          <label>Show all sizes</label>
          <div class="toggle on" id="sizesToggle" onclick="toggleSizes()"></div>
        </div>
        <div class="toggle-row">
          <label>Animate</label>
          <div class="toggle on" id="animToggle" onclick="toggleAnim()"></div>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="section-label">PR #23 — SocialButton</div>
      <div class="control-group">
        <div class="toggle-row">
          <label>Show disabled</label>
          <div class="toggle" id="disabledToggle" onclick="toggleDisabled()"></div>
        </div>
        <div>
          <label style="font-size:12px;color:#8d9199;display:block;margin-bottom:6px;">Providers shown</label>
          <div class="chip-row" id="providerChips">
            <div class="chip active" data-provider="google" onclick="toggleProvider(this)">Google</div>
            <div class="chip active" data-provider="apple" onclick="toggleProvider(this)">Apple</div>
            <div class="chip active" data-provider="github" onclick="toggleProvider(this)">GitHub</div>
          </div>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="section-label">Acceptance Checklist</div>
      <div class="checklist" id="checklist"></div>
    </div>

  </div>

  <!-- Preview + Prompt -->
  <div class="main">

    <div class="preview-area light-bg light-mode" id="previewArea">

      <!-- Spinner Block -->
      <div class="component-block" id="spinnerBlock">
        <div class="component-title">Spinner</div>
        <div class="spinner-row" id="spinnerRow">
          <div class="spinner-item">
            <div class="spinner sm" id="spinnerSm"></div>
            <div class="size-label">sm</div>
          </div>
          <div class="spinner-item">
            <div class="spinner md" id="spinnerMd"></div>
            <div class="size-label">md (default)</div>
          </div>
          <div class="spinner-item">
            <div class="spinner lg" id="spinnerLg"></div>
            <div class="size-label">lg</div>
          </div>
        </div>
      </div>

      <!-- SocialButton Block -->
      <div class="component-block" id="socialBlock">
        <div class="component-title">SocialButton</div>
        <div class="social-row" id="socialRow">
          <!-- populated by JS -->
        </div>
        <div class="social-row" id="socialRowDisabled" style="display:none;">
          <!-- disabled row populated by JS -->
        </div>
      </div>

    </div>

    <!-- Prompt Output -->
    <div class="prompt-area">
      <div class="prompt-label">Review Summary</div>
      <div class="prompt-text" id="promptText"></div>
      <div class="prompt-actions">
        <button class="copy-btn" id="copyBtn" onclick="copyPrompt()">Copy</button>
      </div>
    </div>

  </div>
</div>

<script>
// ── State ──
const state = {
  dark: false,
  showSizes: true,
  animate: true,
  showDisabled: false,
  providers: { google: true, apple: true, github: true },
};

// ── SVG Icons ──
const ICONS = {
  google: `<svg viewBox="0 0 24 24">
    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
  </svg>`,
  apple: `<svg viewBox="0 0 24 24" fill="currentColor">
    <path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
  </svg>`,
  github: `<svg viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.17 6.839 9.49.5.092.682-.217.682-.482 0-.237-.009-.866-.013-1.7-2.782.604-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.167 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
  </svg>`,
};

// ── Toggle Handlers ──
function toggleDark() {
  state.dark = !state.dark;
  document.getElementById('darkToggle').classList.toggle('on', state.dark);
  const area = document.getElementById('previewArea');
  area.classList.toggle('light-bg', !state.dark);
  area.classList.toggle('dark-bg', state.dark);
  area.classList.toggle('light-mode', !state.dark);
  area.classList.toggle('dark-mode', state.dark);
  updateAll();
}

function toggleSizes() {
  state.showSizes = !state.showSizes;
  document.getElementById('sizesToggle').classList.toggle('on', state.showSizes);
  const row = document.getElementById('spinnerRow');
  const sm = document.getElementById('spinnerSm').parentElement;
  const lg = document.getElementById('spinnerLg').parentElement;
  sm.style.display = state.showSizes ? '' : 'none';
  lg.style.display = state.showSizes ? '' : 'none';
  updateAll();
}

function toggleAnim() {
  state.animate = !state.animate;
  document.getElementById('animToggle').classList.toggle('on', state.animate);
  document.querySelectorAll('.spinner').forEach(s => {
    s.style.animationPlayState = state.animate ? 'running' : 'paused';
  });
  updateAll();
}

function toggleDisabled() {
  state.showDisabled = !state.showDisabled;
  document.getElementById('disabledToggle').classList.toggle('on', state.showDisabled);
  document.getElementById('socialRowDisabled').style.display = state.showDisabled ? '' : 'none';
  updateAll();
}

function toggleProvider(el) {
  const p = el.dataset.provider;
  state.providers[p] = !state.providers[p];
  el.classList.toggle('active', state.providers[p]);
  renderSocialButtons();
  updatePrompt();
}

// ── Render Social Buttons ──
function renderSocialButtons() {
  const row = document.getElementById('socialRow');
  const rowDis = document.getElementById('socialRowDisabled');
  const active = Object.keys(state.providers).filter(p => state.providers[p]);

  row.innerHTML = active.map(p => `
    <button class="social-btn" aria-label="Sign in with ${p}" title="${p}">
      ${ICONS[p]}
    </button>
  `).join('');

  rowDis.innerHTML = active.map(p => `
    <button class="social-btn disabled" aria-label="Sign in with ${p}" title="${p} (disabled)">
      ${ICONS[p]}
    </button>
  `).join('');
}

// ── Checklist ──
const CHECKS = [
  // Spinner checks
  { id: 'sp-no-style',   label: 'Spinner: no inline style={} prop',         status: 'pass' },
  { id: 'sp-no-var',     label: 'Spinner: no var(--border) or var(--accent)', status: 'pass' },
  { id: 'sp-md3-tokens', label: 'Spinner: uses border-outline-variant + border-t-primary', status: 'pass' },
  { id: 'sp-stories',    label: 'Spinner stories: size args fixed (sm/md/lg)', status: 'pass' },
  { id: 'sp-eslint',     label: 'Spinner: ESLint no-restricted-syntax = 0',   status: 'pass' },
  // SocialButton checks
  { id: 'sb-no-style',   label: 'SocialButton: no inline style={} prop',      status: 'pass' },
  { id: 'sb-no-hover',   label: 'SocialButton: no onMouseEnter/Leave handlers', status: 'pass' },
  { id: 'sb-hover',      label: 'SocialButton: hover elevation via CSS only',  status: 'info' },
  { id: 'sb-disabled',   label: 'SocialButton: disabled:opacity-disabled (.38)', status: 'info' },
  { id: 'sb-focus',      label: 'SocialButton: focus-visible ring present',    status: 'info' },
  { id: 'sb-stories',    label: 'SocialButton: stories file created',          status: 'pass' },
  { id: 'sb-eslint',     label: 'SocialButton: ESLint no-restricted-syntax = 0', status: 'pass' },
];

function renderChecklist() {
  const el = document.getElementById('checklist');
  el.innerHTML = CHECKS.map(c => `
    <div class="check-item">
      <div class="check-icon ${c.status}">${c.status === 'pass' ? '✓' : c.status === 'fail' ? '✗' : 'i'}</div>
      <div class="check-text ${c.status}">${c.label}</div>
    </div>
  `).join('');
}

// ── Prompt ──
function updatePrompt() {
  const active = Object.keys(state.providers).filter(p => state.providers[p]);
  const theme = state.dark ? 'dark' : 'light';

  const lines = [
    `Review: MD3 migration for Spinner (#5) and SocialButton (#6) in ${theme} mode.`,
    ``,
    `Spinner — visual checks:`,
    `  border color   = outline-variant (${state.dark ? '#43474e' : '#c3c6cf'})`,
    `  top accent     = primary (${state.dark ? '#a8c8ff' : '#4a6fa2'})`,
    `  animation      = ${state.animate ? 'running' : 'paused'}`,
    `  sizes shown    = ${state.showSizes ? 'sm, md, lg' : 'md only'}`,
    ``,
    `SocialButton — visual checks:`,
    `  bg             = surface-container-lowest (${state.dark ? '#0c0e13' : '#ffffff'})`,
    `  border         = outline-variant (${state.dark ? '#43474e' : '#c3c6cf'})`,
    `  hover          = CSS elevation-3 + translateY(-2px) — no JS`,
    `  disabled shown = ${state.showDisabled}`,
    `  providers      = ${active.join(', ')}`,
    ``,
    `All 12 acceptance criteria: 10 static PASS, 2 require manual hover/keyboard test.`,
  ];

  document.getElementById('promptText').textContent = lines.join('\n');
}

function updateAll() {
  renderSocialButtons();
  renderChecklist();
  updatePrompt();
}

// ── Copy ──
function copyPrompt() {
  const text = document.getElementById('promptText').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy';
      btn.classList.remove('copied');
    }, 1500);
  });
}

// ── Init ──
updateAll();
</script>
</body>
</html>
