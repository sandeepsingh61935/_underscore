name = "underscore-mcp"
main = "src/cloud/worker-entry.ts"
compatibility_date = "2024-12-01"

[vars]
# Browser CORS allowlist (public, non-secret). Extension ID is pinned in code.
MCP_ALLOWED_ORIGINS = "https://underscore-web-3i0.pages.dev,https://underscore-web.pages.dev"

# Secrets (set via wrangler secret put, not here):
#   SUPABASE_URL
#   SUPABASE_ANON_KEY
#   MCP_RESOURCE_URL  (optional; stable OAuth resource identifier)
