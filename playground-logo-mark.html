<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>_underscore — Mark Design Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink: #09090c;
  --ink-2: #0e0f14;
  --ink-3: #141620;
  --ink-4: #1a1d29;
  --line: #1f2333;
  --line-hi: #2a2f45;
  --dust: #3d4560;
  --fog: #5a6280;
  --mist: #8892b0;
  --snow: #ccd6f6;
  --white: #e6f0ff;
  --blue: #4a80d4;
  --blue-glow: rgba(74,128,212,0.15);
  --gold: #f0c060;
  --gold-glow: rgba(240,192,96,0.12);
  --green: #64d48a;
}

body {
  background: var(--ink);
  color: var(--snow);
  font-family: 'Manrope', sans-serif;
  height: 100vh;
  overflow: hidden;
  display: grid;
  grid-template-columns: 280px 1fr 320px;
  grid-template-rows: 56px 1fr;
}

/* ── HEADER ── */
header {
  grid-column: 1/-1;
  display: flex;
  align-items: center;
  padding: 0 24px;
  border-bottom: 1px solid var(--line);
  background: rgba(9,9,12,0.95);
  backdrop-filter: blur(12px);
  gap: 20px;
  z-index: 20;
}
.wordmark {
  font-family: 'Space Mono', monospace;
  font-size: 14px;
  font-weight: 700;
  color: var(--white);
  letter-spacing: -0.02em;
}
.wordmark em { color: var(--blue); font-style: normal; }
.tag {
  font-size: 10px;
  font-family: 'Space Mono', monospace;
  padding: 3px 8px;
  border-radius: 4px;
  background: var(--blue-glow);
  color: var(--blue);
  border: 1px solid rgba(74,128,212,0.2);
  letter-spacing: 0.08em;
}
.header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.pill-group {
  display: flex;
  background: var(--ink-3);
  border: 1px solid var(--line-hi);
  border-radius: 8px;
  overflow: hidden;
  padding: 3px;
  gap: 2px;
}
.pill {
  padding: 4px 12px;
  border-radius: 5px;
  font-size: 11px;
  font-family: 'Space Mono', monospace;
  cursor: pointer;
  background: transparent;
  color: var(--fog);
  border: none;
  font-weight: 400;
  transition: all 0.15s;
  white-space: nowrap;
}
.pill:hover { color: var(--mist); }
.pill.on { background: var(--ink-4); color: var(--snow); }
.anim-toggle {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 5px 12px;
  border-radius: 7px;
  border: 1px solid var(--line-hi);
  background: transparent;
  cursor: pointer;
  font-size: 11px;
  font-family: 'Space Mono', monospace;
  color: var(--fog);
  transition: all 0.15s;
}
.anim-toggle:hover { color: var(--mist); border-color: var(--dust); }
.anim-toggle.on { color: var(--gold); border-color: rgba(240,192,96,0.35); background: var(--gold-glow); }
.anim-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* ── LEFT: MARK SELECTOR ── */
.selector {
  border-right: 1px solid var(--line);
  overflow-y: auto;
  padding: 20px 14px;
  background: rgba(9,9,12,0.6);
  scrollbar-width: thin;
  scrollbar-color: var(--line-hi) transparent;
}
.section-label {
  font-size: 9px;
  font-family: 'Space Mono', monospace;
  letter-spacing: 0.14em;
  color: var(--dust);
  text-transform: uppercase;
  margin-bottom: 12px;
  padding-left: 2px;
}
.mark-list { display: flex; flex-direction: column; gap: 4px; }
.mark-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 10px;
  border-radius: 10px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.14s cubic-bezier(0.2,0,0,1);
  background: transparent;
}
.mark-row:hover { background: var(--ink-3); border-color: var(--line); }
.mark-row.active {
  background: var(--ink-4);
  border-color: var(--blue);
  box-shadow: 0 0 0 1px var(--blue), 0 4px 16px rgba(74,128,212,0.1);
}
.mark-thumb {
  width: 40px;
  height: 40px;
  border-radius: 22%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  transition: transform 0.14s;
}
.mark-row:hover .mark-thumb { transform: scale(1.05); }
.mark-row.active .mark-thumb { transform: scale(1.08); }
.mark-info { flex: 1; min-width: 0; }
.mark-name {
  font-size: 12px;
  font-weight: 600;
  color: var(--snow);
  margin-bottom: 2px;
}
.mark-row.active .mark-name { color: var(--white); }
.mark-hint {
  font-size: 10px;
  color: var(--fog);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.3;
}
.mark-row.active .mark-hint { color: var(--mist); }

/* ── CENTER: CANVAS ── */
.canvas {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(ellipse 60% 50% at 50% 50%, rgba(74,128,212,0.04) 0%, transparent 70%),
    repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.018) 39px, rgba(255,255,255,0.018) 40px),
    repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.018) 39px, rgba(255,255,255,0.018) 40px);
}

/* Hero badge */
.hero-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
}
.hero-badge {
  position: relative;
  border-radius: 22%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.2s cubic-bezier(0.2,0,0,1), box-shadow 0.2s;
}
.hero-badge:hover { transform: scale(1.04); }
.hero-badge svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hero-label {
  font-size: 10px;
  font-family: 'Space Mono', monospace;
  color: var(--dust);
  letter-spacing: 0.08em;
  text-align: center;
}

/* Animated pulse ring */
@keyframes pulse-ring {
  0%   { transform: scale(1);    opacity: 0.5; }
  100% { transform: scale(1.25); opacity: 0;   }
}
.hero-badge.animated::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: inherit;
  border: 2px solid var(--blue);
  animation: pulse-ring 1.4s cubic-bezier(0.2,0,0,1) infinite;
  pointer-events: none;
}

/* Size rail */
.size-rail {
  display: flex;
  align-items: flex-end;
  gap: 24px;
  padding: 24px 32px 0;
  flex-shrink: 0;
  border-top: 1px solid var(--line);
  width: 100%;
  justify-content: center;
  margin-top: 32px;
}
.size-col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.size-badge {
  border-radius: 22%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  transition: transform 0.2s;
  cursor: pointer;
  flex-shrink: 0;
}
.size-badge:hover { transform: scale(1.08); }
.size-badge svg { position: absolute; }
.size-badge { position: relative; }
.size-px {
  font-size: 9px;
  font-family: 'Space Mono', monospace;
  color: var(--dust);
  letter-spacing: 0.06em;
}

/* ── RIGHT: DETAILS ── */
.details {
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  background: rgba(9,9,12,0.6);
  overflow: hidden;
}

/* Mark identity */
.mark-identity {
  padding: 20px 18px 16px;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.mark-title {
  font-family: 'Manrope', sans-serif;
  font-size: 22px;
  font-weight: 800;
  color: var(--white);
  letter-spacing: -0.03em;
  margin-bottom: 6px;
}
.mark-desc {
  font-size: 11.5px;
  line-height: 1.65;
  color: var(--fog);
}

/* Scores */
.scores {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.score-item { display: flex; flex-direction: column; gap: 5px; }
.score-label {
  font-size: 9px;
  font-family: 'Space Mono', monospace;
  letter-spacing: 0.1em;
  color: var(--dust);
  text-transform: uppercase;
}
.score-bar-track {
  height: 3px;
  background: var(--line-hi);
  border-radius: 2px;
  overflow: hidden;
}
.score-bar-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.35s cubic-bezier(0.2,0,0,1);
}
.score-val {
  font-size: 10px;
  font-family: 'Space Mono', monospace;
  color: var(--mist);
}

/* Code block */
.code-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.code-head {
  display: flex;
  align-items: center;
  padding: 10px 18px;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.code-head-label {
  font-size: 9px;
  font-family: 'Space Mono', monospace;
  letter-spacing: 0.12em;
  color: var(--dust);
  text-transform: uppercase;
  flex: 1;
}
.copy-btn {
  font-size: 10px;
  font-family: 'Space Mono', monospace;
  padding: 4px 10px;
  border-radius: 5px;
  border: 1px solid var(--line-hi);
  background: transparent;
  color: var(--fog);
  cursor: pointer;
  transition: all 0.12s;
}
.copy-btn:hover { color: var(--blue); border-color: var(--blue); background: var(--blue-glow); }
.copy-btn.done { color: var(--green); border-color: rgba(100,212,138,0.4); background: rgba(100,212,138,0.07); }
pre.code {
  flex: 1;
  overflow-y: auto;
  padding: 14px 18px;
  font-size: 10.5px;
  line-height: 1.8;
  font-family: 'Space Mono', monospace;
  color: var(--fog);
  scrollbar-width: thin;
  scrollbar-color: var(--line-hi) transparent;
  white-space: pre-wrap;
  word-break: break-all;
}
.t-tag  { color: #7ec8e3; }
.t-attr { color: #a8d8a8; }
.t-val  { color: #f4a261; }
.t-cmt  { color: var(--dust); font-style: italic; }

/* Animations */
@keyframes glyph-in {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}
.hero-badge svg { animation: glyph-in 0.22s cubic-bezier(0.2,0,0,1) both; }
</style>
</head>
<body>

<header>
  <div class="wordmark"><em>_</em>underscore</div>
  <div class="tag">mark design studio</div>
  <div class="header-right">
    <div class="pill-group" id="bgPills">
      <button class="pill on" onclick="setBg('light')">light</button>
      <button class="pill" onclick="setBg('dark')">dark</button>
    </div>
    <button class="anim-toggle" id="animBtn" onclick="toggleAnim()">
      <span class="anim-dot"></span>animate
    </button>
  </div>
</header>

<div class="selector">
  <div class="section-label">Mark candidates</div>
  <div class="mark-list" id="markList"></div>
</div>

<div class="canvas" id="canvas">
  <div class="hero-wrap">
    <div class="hero-badge" id="heroBadge" style="width:96px;height:96px"></div>
    <div class="hero-label" id="heroLabel">96px</div>
  </div>
  <div class="size-rail" id="sizeRail"></div>
</div>

<div class="details">
  <div class="mark-identity">
    <div class="mark-title" id="detTitle"></div>
    <div class="mark-desc" id="detDesc"></div>
  </div>
  <div class="scores" id="detScores"></div>
  <div class="code-wrap">
    <div class="code-head">
      <span class="code-head-label">SVG · 100×100 viewBox</span>
      <button class="copy-btn" id="copyBtn" onclick="copySvg()">copy</button>
    </div>
    <pre class="code" id="codeBlock"></pre>
  </div>
</div>

<script>
// ── MARKS ──────────────────────────────────────────────────────────────────

const MARKS = [
  {
    id: 'refined-baseline',
    name: 'Refined Baseline',
    hint: 'Classic _ in correct position',
    desc: 'The underscore in its true typographic home — bottom third of the badge. Wide, low, grounded. Perfectly proportioned at 68×11px with 5.5px radii.',
    scores: { readability: 95, scalability: 98, distinctiveness: 55, elegance: 80 },
    body: `<rect x="16" y="66" width="68" height="11" rx="5.5" fill="currentColor"/>`,
    stroke: false,
  },
  {
    id: 'dual-weight',
    name: 'Dual Weight',
    hint: 'Ghost line + bold underscore',
    desc: 'A ghost reference line above and the bold underscore below. The tension between the faint and the sharp creates hierarchy — a mark with visual depth.',
    scores: { readability: 88, scalability: 85, distinctiveness: 82, elegance: 90 },
    body: `<rect x="22" y="40" width="56" height="7" rx="3.5" fill="currentColor" opacity="0.35"/>
<rect x="16" y="64" width="68" height="12" rx="6" fill="currentColor"/>`,
    stroke: false,
  },
  {
    id: 'document',
    name: 'Document',
    hint: 'Text lines with accent underscore',
    desc: 'Three abstract text rows — two ghost lines (content) and a strong underscore at the base (emphasis). Reads as a document with a marked line.',
    scores: { readability: 78, scalability: 72, distinctiveness: 88, elegance: 86 },
    body: `<rect x="22" y="28" width="56" height="7" rx="3.5" fill="currentColor" opacity="0.28"/>
<rect x="22" y="43" width="44" height="7" rx="3.5" fill="currentColor" opacity="0.28"/>
<rect x="16" y="63" width="68" height="11" rx="5.5" fill="currentColor"/>`,
    stroke: false,
  },
  {
    id: 'cursor',
    name: 'Cursor',
    hint: 'Text cursor + underscore',
    desc: 'A vertical cursor bar paired with a horizontal underscore. Direct reference to the text editing moment — the instant before you start typing.',
    scores: { readability: 85, scalability: 80, distinctiveness: 94, elegance: 88 },
    body: `<rect x="44" y="24" width="11" height="30" rx="5.5" fill="currentColor"/>
<rect x="16" y="64" width="68" height="11" rx="5.5" fill="currentColor"/>`,
    stroke: false,
  },
  {
    id: 'highlight-block',
    name: 'Highlight Block',
    hint: 'Thick marker/highlighter stroke',
    desc: 'A wide, bold block that mirrors a physical highlighter dragged across text. Immediate product metaphor. Anchored in the lower-center of the badge.',
    scores: { readability: 96, scalability: 97, distinctiveness: 72, elegance: 75 },
    body: `<rect x="12" y="36" width="76" height="28" rx="9" fill="currentColor"/>`,
    stroke: false,
  },
  {
    id: 'stacked',
    name: 'Stacked',
    hint: 'Three tapering lines',
    desc: 'Three descending bars that taper right — each line shorter than the last. Reads as progressively highlighted text rows. Motion, rhythm, reduction.',
    scores: { readability: 75, scalability: 68, distinctiveness: 90, elegance: 82 },
    body: `<rect x="16" y="28" width="68" height="10" rx="5" fill="currentColor"/>
<rect x="22" y="46" width="54" height="10" rx="5" fill="currentColor"/>
<rect x="30" y="64" width="40" height="10" rx="5" fill="currentColor"/>`,
    stroke: false,
  },
  {
    id: 'bracket',
    name: 'L-Bracket',
    hint: 'Corner bracket — code reference',
    desc: 'Two strokes forming an L — a bottom-left bracket that frames the content it marks. References code, brackets, annotation. The most distinctive of the set.',
    scores: { readability: 80, scalability: 82, distinctiveness: 96, elegance: 84 },
    body: `<path d="M70 24 L24 24 L24 76" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`,
    stroke: true,
  },
  {
    id: 'negative',
    name: 'Negative Space',
    hint: 'Filled block with cut-out mark',
    desc: 'A bold rounded square with the underscore punched out as negative space. The badge background shows through the cut. Inversion, depth, elegance.',
    scores: { readability: 82, scalability: 86, distinctiveness: 96, elegance: 95 },
    body: `<defs>
  <mask id="neg-mask">
    <rect x="0" y="0" width="100" height="100" fill="white"/>
    <rect x="14" y="63" width="72" height="14" rx="7" fill="black"/>
  </mask>
</defs>
<rect x="10" y="10" width="80" height="80" rx="16" fill="currentColor" mask="url(#neg-mask)"/>`,
    stroke: false,
  },
  {
    id: 'wave',
    name: 'Wave',
    hint: 'Curved underscore, flowing',
    desc: 'A gently undulating stroke — fluid and expressive. Suggests the motion of reading, the rhythm of scanning highlighted text. Warm, organic, memorable.',
    scores: { readability: 78, scalability: 74, distinctiveness: 92, elegance: 90 },
    body: `<path d="M13 56 C27 38 40 38 50 50 C60 62 73 62 87 44" stroke="currentColor" stroke-width="12" stroke-linecap="round" fill="none"/>`,
    stroke: true,
  },
  {
    id: 'selection',
    name: 'Text Selection',
    hint: 'Two lines, selected text',
    desc: 'A long line and a shorter line below it — the classic visual of two selected text rows. Instantly understood, product-native, unambiguous.',
    scores: { readability: 92, scalability: 90, distinctiveness: 78, elegance: 83 },
    body: `<rect x="16" y="38" width="68" height="11" rx="5.5" fill="currentColor"/>
<rect x="16" y="58" width="44" height="11" rx="5.5" fill="currentColor" opacity="0.55"/>`,
    stroke: false,
  },
];

// ── STATE ──────────────────────────────────────────────────────────────────

const state = { active: MARKS[0].id, bg: 'light', anim: false };

const BG = {
  light: { badge: '#1a1a1a', mark: '#ffffff', shadow: '0 4px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08)' },
  dark:  { badge: '#e8e8ec', mark: '#1a1a1a', shadow: '0 4px 20px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.6)' },
};

const SCORE_COLORS = {
  readability:    '#64d48a',
  scalability:    '#4a80d4',
  distinctiveness:'#f0c060',
  elegance:       '#e07aff',
};
const SCORE_LABELS = {
  readability: 'Readability',
  scalability: 'Scale',
  distinctiveness: 'Distinct',
  elegance: 'Elegance',
};

// ── HELPERS ────────────────────────────────────────────────────────────────

function activeMark() { return MARKS.find(m => m.id === state.active); }

function makeSvg(mark, px) {
  const col = BG[state.bg];
  return `<svg viewBox="0 0 100 100" width="${px}" height="${px}"
    xmlns="http://www.w3.org/2000/svg" style="color:${col.mark};position:absolute;inset:0">
  ${mark.body}
</svg>`;
}

function badgeStyle(px) {
  const col = BG[state.bg];
  return `width:${px}px;height:${px}px;background:${col.badge};box-shadow:${col.shadow};position:relative;`;
}

function highlight(code) {
  return code
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/(&lt;\/?)([\w-]+)/g, (_, lt, tag) => `${lt}<span class="t-tag">${tag}</span>`)
    .replace(/ ([\w-]+)=/g, ` <span class="t-attr">$1</span>=`)
    .replace(/"([^"]*)"/g, `"<span class="t-val">$1</span>"`)
    .replace(/(\/\*.*?\*\/)/gs, `<span class="t-cmt">$1</span>`);
}

// ── RENDER ─────────────────────────────────────────────────────────────────

function renderHero() {
  const mark = activeMark();
  const hero = document.getElementById('heroBadge');
  hero.style.cssText = badgeStyle(96);
  hero.innerHTML = makeSvg(mark, 96);
  hero.classList.toggle('animated', state.anim);
}

function renderSizeRail() {
  const mark = activeMark();
  const sizes = [20, 28, 36, 48, 64];
  const labels = ['20px', '28px\nsm', '36px\nmd', '48px\nlg', '64px'];
  const rail = document.getElementById('sizeRail');
  rail.innerHTML = sizes.map((px, i) => `
    <div class="size-col">
      <div class="size-badge" style="${badgeStyle(px)}">
        ${makeSvg(mark, px)}
      </div>
      <div class="size-px">${labels[i].replace('\n','<br>')}</div>
    </div>`).join('');
}

function renderMarkList() {
  const col = BG[state.bg];
  const list = document.getElementById('markList');
  list.innerHTML = MARKS.map(m => `
    <div class="mark-row${m.id === state.active ? ' active' : ''}" onclick="select('${m.id}')">
      <div class="mark-thumb" style="background:${col.badge};box-shadow:${col.shadow}">
        ${makeSvg(m, 40)}
      </div>
      <div class="mark-info">
        <div class="mark-name">${m.name}</div>
        <div class="mark-hint">${m.hint}</div>
      </div>
    </div>`).join('');
}

function renderDetails() {
  const mark = activeMark();
  document.getElementById('detTitle').textContent = mark.name;
  document.getElementById('detDesc').textContent = mark.desc;

  document.getElementById('detScores').innerHTML = Object.entries(mark.scores).map(([k, v]) => `
    <div class="score-item">
      <div class="score-label">${SCORE_LABELS[k]}</div>
      <div class="score-bar-track">
        <div class="score-bar-fill" style="width:${v}%;background:${SCORE_COLORS[k]}"></div>
      </div>
      <div class="score-val" style="color:${SCORE_COLORS[k]}">${v}/100</div>
    </div>`).join('');

  const raw = `<!-- ${mark.name} — _underscore mark -->
<!-- viewBox: 0 0 100 100 · squircle: border-radius 22% -->

<svg
  viewBox="0 0 100 100"
  xmlns="http://www.w3.org/2000/svg"
  aria-hidden="true"
>
  ${mark.body}
</svg>

/* React Logo.tsx usage:
 * <Logo size="sm" />   // 28px
 * <Logo size="md" />   // 36px
 * <Logo size="lg" />   // 48px
 * <Logo dimmed />      // 404 page
 */`;

  document.getElementById('codeBlock').innerHTML = highlight(raw);
}

function renderAll() {
  renderHero();
  renderSizeRail();
  renderMarkList();
  renderDetails();
}

// ── CONTROLS ───────────────────────────────────────────────────────────────

function select(id) {
  state.active = id;
  renderAll();
}

function setBg(bg) {
  state.bg = bg;
  document.querySelectorAll('#bgPills .pill').forEach(b =>
    b.classList.toggle('on', b.textContent.trim() === bg));
  renderAll();
}

function toggleAnim() {
  state.anim = !state.anim;
  const btn = document.getElementById('animBtn');
  btn.classList.toggle('on', state.anim);
  btn.querySelector('.anim-dot').style.background = state.anim ? 'var(--gold)' : 'currentColor';
  renderHero();
}

function copySvg() {
  const mark = activeMark();
  const col = BG[state.bg];
  const text = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">\n  ${mark.body}\n</svg>`;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'copied!';
    btn.classList.add('done');
    setTimeout(() => { btn.textContent = 'copy'; btn.classList.remove('done'); }, 2200);
  });
}

// ── KEYBOARD ───────────────────────────────────────────────────────────────

document.addEventListener('keydown', e => {
  const idx = MARKS.findIndex(m => m.id === state.active);
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') select(MARKS[Math.min(idx+1, MARKS.length-1)].id);
  if (e.key === 'ArrowUp'   || e.key === 'ArrowLeft')  select(MARKS[Math.max(idx-1, 0)].id);
  if (e.key === 'l') setBg('light');
  if (e.key === 'd') setBg('dark');
  if (e.key === 'a') toggleAnim();
});

renderAll();
</script>
</body>
</html>
