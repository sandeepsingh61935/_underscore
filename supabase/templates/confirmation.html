<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Confirm your signup</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f1ec; font-family:Georgia, 'Times New Roman', serif; color:#1a1a18;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f1ec; padding:40px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border:1px solid #e3ddd2; border-radius:8px; padding:40px;">
          <tr>
            <td style="text-align:center; padding-bottom:24px;">
              <span style="font-size:20px; font-weight:600; letter-spacing:-0.02em;">underscore</span>
            </td>
          </tr>
          <tr>
            <td style="text-align:center; padding-bottom:16px;">
              <h1 style="font-size:22px; font-weight:500; margin:0;">Confirm your signup</h1>
            </td>
          </tr>
          <tr>
            <td style="text-align:center; padding-bottom:24px; font-family:Helvetica, Arial, sans-serif; font-size:15px; color:#5c574e;">
              Enter this 6-digit code to confirm your account and finish creating it.
            </td>
          </tr>
          <tr>
            <td style="text-align:center; padding-bottom:24px;">
              <span style="display:inline-block; font-family:'Courier New', monospace; font-size:36px; letter-spacing:0.3em; font-weight:600; padding:12px 24px; background-color:#f4f1ec; border-radius:6px;">
                {{ .Token }}
              </span>
            </td>
          </tr>
          <tr>
            <td style="text-align:center; font-family:Helvetica, Arial, sans-serif; font-size:13px; color:#8a8477;">
              This code expires shortly. If you didn't request this, you can safely ignore this email.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
